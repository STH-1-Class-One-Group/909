<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #preview{
        display:none
        }
    </style>


</head>

<body>
    <h1>서버 통신 테스트</h1>
    <button onclick="getData('success')">성공 테스트</button>
    <button onclick="getData('fail')">실패 테스트</button>

    <div id="display" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"> 결과가 여기 표시됩니다. </div>

    <h1>GET/POST 연결 테스트</h1>
    <form action="">
        <textarea name="usertext" id="user-text" placeholder="입력해주세요"></textarea>
        <button id="save-db-button">저장</button>
        <button id="get-db-button">DB 가져와</button>
        <input type="file" id="img-user-input" accept="image/*">
    </form>
    <div id = "div-img"></div>
    <img id="preview" src="" style="display:none; max-width:300px;">
    <div class = "DB-plus-div">
    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>





<!--
ID / input-content : content 받는 input
ID / save-db-button : 저장 버튼
ID / get-db-button : DB 내용 가져오는 버튼

CLASS / DB-plus-div : 받은 DB 데이터를 출력하기 위한 영역(위치) 
-->
