<style data-purpose="custom-glassmorphism">
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .ice-bubble {
        background: rgba(224, 244, 251, 0.7); /* Light icy blue */
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        text-shadow: 0 0 5px rgba(255,255,255,0.7);
    }
    .waddle-animation {
        animation: waddle 0.5s ease-in-out;
    }
    @keyframes waddle {
        0% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(-8deg) scale(1.1); }
        50% { transform: rotate(8deg) scale(1.1); }
        75% { transform: rotate(-8deg) scale(1.1); }
        100% { transform: rotate(0deg) scale(1); }
    }
    .map-container {
      background: #f0f9ff;
      background-image: radial-gradient(#d1eef9 1.5px, transparent 1.5px);
      background-size: 30px 30px;
    }
    .penguin-pin {
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      transition: transform 0.2s ease-in-out;
    }
    .penguin-pin:hover {
      transform: translateY(-5px) scale(1.1);
    }
    /* Simple animation for the mascot */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .mascot-float {
      animation: float 3s ease-in-out infinite;
    }
    .pulse-blue {
      box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
      animation: pulse-blue 2s infinite;
    }
    @keyframes pulse-blue {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
  </style>

<script data-purpose="simulated-interactions">
    // Minimal interaction logic for demo
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        console.log('Action triggered: ' + btn.innerText);
      });
    });

    const penguinMascot = document.getElementById('penguin-mascot');
    const speechBubble = document.getElementById('penguin-speech-bubble');
    const messageElement = document.getElementById('penguin-message');

    const messages = [
        "나도 같이갈래🐧",
        "펭귄들은 하루에 17~23km를 걸어서 이동해",
        "황제펭귄은 한 번 잠수하면 수심 500m까지 내려가고 20분 넘게 버틸 수 있대",
        "아델리펭귄은 마음에 드는 상대에게 프러포즈할 때 예쁜 조약돌을 선물한대",
        "펭귄은 무릎이 없는 것처럼 보이지만 사실 털 속에 'ㄴ'자로 굽힌 무릎이 숨겨져 있어",
        "펭귄은 가끔 빙하 위에서 똥을 너무 많이 싸서, 우주 인공위성에서도 그 흔적이 보일 정도래.",
        "펭귄은 사실 무릎을 굽힌 채로 계속 투명 인간처럼 '기마 자세'를 유지하며 살고 있어. 엑스레이 찍으면 다 나와!",
        "나도 여행을 좋아해 나도 같이가도 돼?"
    ];

    let bubbleTimeout;

    penguinMascot.addEventListener('click', () => {
        // Clear any existing timeout
        if (bubbleTimeout) {
            clearTimeout(bubbleTimeout);
        }

        const randomIndex = Math.floor(Math.random() * messages.length);
        messageElement.textContent = messages[randomIndex];
        speechBubble.classList.remove('hidden');

        // Add waddle animation
        penguinMascot.classList.add('waddle-animation');

        bubbleTimeout = setTimeout(() => {
            speechBubble.classList.add('hidden');
        }, 10000);
    });

    // Remove animation class when it finishes
    penguinMascot.addEventListener('animationend', () => {
        penguinMascot.classList.remove('waddle-animation');
    });
  </script>
